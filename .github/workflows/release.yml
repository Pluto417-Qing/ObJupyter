name: Build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check version
        shell: pwsh
        run: |
          $manifestVersion = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lockVersion = (Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable).version
          if ($manifestVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "manifest.json version must be x.y.z: $manifestVersion"
          }
          if ($manifestVersion -ne $packageVersion) {
            throw "manifest.json ($manifestVersion) and package.json ($packageVersion) versions differ"
          }
          if ($manifestVersion -ne $lockVersion) {
            throw "manifest.json ($manifestVersion) and package-lock.json ($lockVersion) versions differ"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $manifestVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match manifest.json version $manifestVersion"
          }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Install Python test dependencies
        run: python -m pip install jupyter_client ipykernel

      - name: Test Python bridge
        run: python -m unittest discover -s tests -p test_bridge.py -v

      - run: npm run build

      - name: Attest release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-release
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
